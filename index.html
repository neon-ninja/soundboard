<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2a1a4a">
  <title>Aphmau Soundboard</title>
  <link rel="preconnect" href="." crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1><span class="paw">🐾</span> Aphmau Soundboard</h1>
    <p class="tagline">Tap a button. Feel the chaos.</p>
  </header>

  <main>
    <section class="section" aria-labelledby="wt-heading">
      <h2 id="wt-heading" class="section-title">⚡ &ldquo;WHAT THE—?!&rdquo; Collection</h2>
      <div class="grid grid-featured" id="grid-whatthe"></div>
    </section>

    <section class="section" aria-labelledby="classics-heading">
      <h2 id="classics-heading" class="section-title">💜 Classics</h2>
      <div class="grid" id="grid-classics"></div>
    </section>

    <section class="section" aria-labelledby="sass-heading">
      <h2 id="sass-heading" class="section-title">🔥 Maximum Sass</h2>
      <div class="grid" id="grid-sass"></div>
    </section>

    <section class="section" aria-labelledby="sleepy-heading">
      <h2 id="sleepy-heading" class="section-title">🌙 Sleepy Time</h2>
      <div class="grid" id="grid-sleepy"></div>
    </section>
  </main>

  <button class="fab" id="random-btn" aria-label="Play a random sound">🎲</button>

  <footer class="footer">
    <p>Fan-made soundboard &middot; clips from Aphmau's <em>MyStreet: Phoenix Drop High</em> series</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
