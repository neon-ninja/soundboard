<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2a1a4a">
  <title>Soundboards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>🎛️ Soundboards</h1>
    <nav class="tabs" aria-label="Choose a soundboard">
      <button class="tab active" id="tab-aphmau" data-board="0">🐾 Aphmau</button>
      <button class="tab" id="tab-sisi" data-board="1">🥢 思思</button>
    </nav>
    <p class="tagline">Tap a button. Swipe to switch boards.</p>
  </header>

  <main class="boards" id="boards">
    <section class="board board-aphmau" aria-label="Aphmau soundboard">
      <div class="section">
        <h2 class="section-title">⚡ &ldquo;WHAT THE—?!&rdquo; Collection</h2>
        <div class="grid grid-featured" id="grid-whatthe"></div>
      </div>
      <div class="section">
        <h2 class="section-title">💜 Classics</h2>
        <div class="grid" id="grid-classics"></div>
      </div>
      <div class="section">
        <h2 class="section-title">🔥 Maximum Sass</h2>
        <div class="grid" id="grid-sass"></div>
      </div>
      <div class="section">
        <h2 class="section-title">🌙 Sleepy Time</h2>
        <div class="grid" id="grid-sleepy"></div>
      </div>
      <footer class="footer">
        <p>Clips from Aphmau's <em>MyStreet: Phoenix Drop High</em> series</p>
      </footer>
    </section>

    <section class="board board-sisi" aria-label="思思 soundboard">
      <div class="section">
        <h2 class="section-title">⚡ Signature Moves</h2>
        <div class="grid grid-featured" id="grid-sisi-sig"></div>
      </div>
      <div class="section">
        <h2 class="section-title">🥢 Kitchen &amp; Live</h2>
        <div class="grid" id="grid-sisi-live"></div>
      </div>
      <footer class="footer">
        <p>Clips from 思思 (@xiexie888888) on Instagram &middot; hanzi + pinyin + English</p>
      </footer>
    </section>
  </main>

  <button class="fab" id="random-btn" aria-label="Play a random sound">🎲</button>

  <script src="app.js"></script>
</body>
</html>
