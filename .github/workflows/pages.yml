name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pages serves from the gh-pages branch; mirror main into it so every
      # push to main updates the live site.
      - run: git push --force origin HEAD:gh-pages
